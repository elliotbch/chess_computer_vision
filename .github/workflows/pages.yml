# Publie la démo statique (dossier site/) sur GitHub Pages à chaque push sur la branche par défaut.
# Avant le déploiement : les copies du code Python dans site/py/ doivent être identiques à src/ et à demo/app.py.
name: Déploiement GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Copies de site/py/ identiques au code du dépôt
        run: python site/tests/test_sync.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
